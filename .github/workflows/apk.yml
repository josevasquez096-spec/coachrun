# Compila el APK de Android en la nube: aquí no hace falta ningún computador
# con Android Studio. Al terminar deja el archivo colgado en la pestaña
# "Releases" del repositorio, con enlace público para descargarlo al teléfono.
name: APK de Android

on:
  workflow_dispatch:          # se puede lanzar a mano desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - 'movil/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write             # para publicar el APK en Releases

jobs:
  compilar:
    # Fijada a propósito: con 'ubuntu-latest' la máquina cambia sola y ya nos
    # rompió una compilación sin haber tocado nosotros nada.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: movil/package-lock.json

      # Capacitor 6 y el complemento de Android piden Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Antes se usaba android-actions/setup-android, pero intentaba instalar el
      # paquete 'tools', que ya no existe en las versiones nuevas del kit, y la
      # compilación moría ahí. La máquina de GitHub ya trae el kit de Android:
      # basta con apuntar a él y asegurarse de que están las piezas que usamos.
      - name: Preparar el kit de Android
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Kit de Android en: $SDK"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: ${SDKM:-no encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "sdk.dir=$SDK" > movil/android/local.properties
          echo "--- plataformas disponibles ---"; ls "$SDK/platforms" || true
          echo "--- build-tools disponibles ---"; ls "$SDK/build-tools" || true

      - name: Instalar dependencias
        working-directory: movil
        run: npm ci

      # Empaqueta src/app.js dentro de www/. Hace falta: `registerPlugin` no
      # viene con Android, la trae @capacitor/core y hay que meterla dentro.
      - name: Empaquetar la pantalla de prueba
        working-directory: movil
        run: npm run build

      - name: Pasar la web a la cáscara de Android
        working-directory: movil
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: movil/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Renombrar con la fecha
        id: apk
        run: |
          FECHA=$(date +%Y%m%d-%H%M)
          mkdir -p salida
          cp movil/android/app/build/outputs/apk/debug/app-debug.apk "salida/MyCoachRuns-prueba-$FECHA.apk"
          echo "archivo=salida/MyCoachRuns-prueba-$FECHA.apk" >> "$GITHUB_OUTPUT"
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"

      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Una única entrega que se va reemplazando, para que el enlace no cambie.
          gh release delete apk-prueba --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-prueba "${{ steps.apk.outputs.archivo }}" \
            --title "APK de prueba · ${{ steps.apk.outputs.fecha }}" \
            --prerelease \
            --notes "Versión de prueba para medir el GPS con la pantalla apagada.

          **Está firmada con una clave de pruebas**, así que para instalar una versión nueva hay que
          desinstalar la anterior primero. Eso se arregla cuando pasemos a la app de verdad.

          Al instalar, Android avisará de que viene de un origen desconocido: hay que permitirlo una vez."
