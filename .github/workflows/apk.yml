# Compila el APK de Android en la nube: aquí no hace falta ningún computador
# con Android Studio. Al terminar deja el archivo colgado en la pestaña
# "Releases" del repositorio, con enlace público para descargarlo al teléfono.
#
# Desde la v5 el APK lleva la web entera dentro (las 8 pantallas), no solo la
# pantalla de prueba del GPS. Por eso hay que compilar también el proyecto de
# la raíz: `scripts/compilar-movil.sh` lo hace y deja el resultado en movil/www.
name: APK de Android

on:
  workflow_dispatch:          # se puede lanzar a mano desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - 'movil/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.js'
      - 'package-lock.json'
      - 'scripts/compilar-movil.sh'
      - '.github/workflows/apk.yml'

permissions:
  contents: write             # para publicar el APK en Releases

env:
  # La dirección del servidor al que llama la app. Queda grabada dentro del
  # APK al compilar, así que el día que se mude a mycoachruns.com se cambia
  # AQUÍ y se vuelve a compilar; con el APK viejo la app seguiría llamando a
  # la dirección antigua.
  SERVIDOR: https://mycoachruns.com

jobs:
  compilar:
    # Fijada a propósito: con 'ubuntu-latest' la máquina cambia sola y ya nos
    # rompió una compilación sin haber tocado nosotros nada.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            movil/package-lock.json

      # Capacitor 6 y el complemento de Android piden Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Antes se usaba android-actions/setup-android, pero intentaba instalar el
      # paquete 'tools', que ya no existe en las versiones nuevas del kit, y la
      # compilación moría ahí. La máquina de GitHub ya trae el kit de Android:
      # basta con apuntar a él y asegurarse de que están las piezas que usamos.
      - name: Preparar el kit de Android
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Kit de Android en: $SDK"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: ${SDKM:-no encontrado}"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "sdk.dir=$SDK" > movil/android/local.properties
          echo "--- plataformas disponibles ---"; ls "$SDK/platforms" || true
          echo "--- build-tools disponibles ---"; ls "$SDK/build-tools" || true

      - name: Instalar dependencias de la web
        run: npm ci

      - name: Instalar dependencias de la cáscara
        working-directory: movil
        run: npm ci

      # Compila las pantallas como archivos sueltos y las deja en movil/www,
      # junto con la pantalla de diagnóstico del GPS en /prueba/.
      # Las llamadas de API apuntan al servidor de Vercel: la app las hace por
      # internet, llevando la sesión en la cabecera Authorization.
      # Las claves NEXT_PUBLIC_ se quedan grabadas dentro del APK al compilar
      # (son las mismas que ya viajan a cualquier navegador, no son secretas).
      # Si faltan, la app se instalaría y no podría entrar: mejor parar aquí y
      # decirlo claro que entregar un APK roto.
      - name: Comprobar las claves
        run: |
          faltan=""
          [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] || faltan="$faltan NEXT_PUBLIC_SUPABASE_URL"
          [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] || faltan="$faltan NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan estas claves en el repositorio:$faltan"
            echo "Se añaden en GitHub → Settings → Secrets and variables → Actions → New repository secret."
            echo "Son los mismos valores que ya están en Vercel (Settings → Environment Variables)."
            exit 1
          fi
          echo "Claves presentes."

      - name: Meter la web dentro del APK
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ env.SERVIDOR }}
        run: ./scripts/compilar-movil.sh "$SERVIDOR"

      - name: Pasar la web a la cáscara de Android
        working-directory: movil
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: movil/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Renombrar con la fecha
        id: apk
        run: |
          FECHA=$(date +%Y%m%d-%H%M)
          mkdir -p salida
          cp movil/android/app/build/outputs/apk/debug/app-debug.apk "salida/MyCoachRuns-prueba-$FECHA.apk"
          echo "archivo=salida/MyCoachRuns-prueba-$FECHA.apk" >> "$GITHUB_OUTPUT"
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"

      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Una única entrega que se va reemplazando, para que el enlace no cambie.
          gh release delete apk-prueba --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-prueba "${{ steps.apk.outputs.archivo }}" \
            --title "APK de prueba · ${{ steps.apk.outputs.fecha }}" \
            --prerelease \
            --notes "La app entera dentro del teléfono, usando el GPS nativo (sigue midiendo con la pantalla apagada).

          La pantalla de diagnóstico del GPS sigue disponible en /prueba/ dentro de la app.

          **Está firmada con una clave de pruebas**, así que para instalar una versión nueva hay que
          desinstalar la anterior primero. Eso se arregla cuando pasemos a la app de verdad.

          Al instalar, Android avisará de que viene de un origen desconocido: hay que permitirlo una vez."
